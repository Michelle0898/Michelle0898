<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文昌航天城 · 英语翻转卡片</title>
  <meta name="creative-medium" content="interactive-prototype">
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Poppins:wght@600;700;800;900&family=Nunito:wght@700;800;900&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      font-family: 'Nunito', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #e0f4ff 0%, #c9ecff 25%, #b8e4ff 50%, #d5f0ff 75%, #e8f7ff 100%);
      background-attachment: fixed;
      min-height: 100vh;
      padding: 24px 16px 40px;
      position: relative;
    }

    /* 柔和的云朵装饰 */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 320px;
      height: 320px;
      top: -80px;
      left: -60px;
    }

    body::after {
      width: 400px;
      height: 400px;
      bottom: -120px;
      right: -100px;
      background: rgba(200, 230, 255, 0.6);
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 头部 */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: clamp(24px, 4vw, 38px);
      color: #0c4a6e;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-shadow: 0 2px 12px rgba(14, 116, 144, 0.15);
    }

    .header .subtitle {
      font-weight: 700;
      font-size: clamp(13px, 2vw, 16px);
      color: #0369a1;
      opacity: 0.8;
    }

    /* 操作按钮区 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 15px;
      padding: 12px 26px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 14px rgba(14, 116, 144, 0.18);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: white;
      color: #0369a1;
      border: 2px solid #7dd3fc;
    }

    .btn-secondary:hover {
      background: #f0f9ff;
      border-color: #38bdf8;
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.2);
      transform: translateY(-2px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    /* 卡片网格 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      perspective: 1500px;
    }

    /* 卡片容器 */
    .card-wrapper {
      aspect-ratio: 4 / 3;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-wrapper.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(14, 116, 144, 0.22),
                  0 2px 8px rgba(14, 116, 144, 0.1);
    }

    /* 卡片正面 - 图片 */
    .card-front {
      background: white;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-front .card-number {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.92);
      color: #0369a1;
      font-weight: 900;
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      z-index: 2;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .card-front .tap-hint {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.9);
      color: #0369a1;
      font-weight: 700;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: opacity 0.3s;
    }

    .card-wrapper.flipped .tap-hint {
      opacity: 0;
    }

    /* 卡片背面 - 句子 */
    .card-back {
      background: linear-gradient(150deg, #ffffff 0%, #f0f9ff 50%, #e0f2fe 100%);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      padding: 18px 20px;
      border: 2px solid #bae6fd;
    }

    .card-back .sentence-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
    }

    .card-back .sentence {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      color: #0c4a6e;
      line-height: 1.45;
      width: 100%;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .card-back .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1.5px dashed #7dd3fc;
    }

    .card-back .card-index {
      font-weight: 900;
      font-size: 13px;
      color: #0ea5e9;
      background: #e0f2fe;
      padding: 3px 10px;
      border-radius: 12px;
    }

    .card-back .flip-back-hint {
      font-weight: 700;
      font-size: 11px;
      color: #0284c7;
      opacity: 0.7;
    }

    /* hover 效果 - 仅桌面端 */
    @media (hover: hover) and (pointer: fine) {
      .card-wrapper:hover .card-inner {
        transform: rotateY(8deg) translateY(-4px);
      }
      .card-wrapper.flipped:hover .card-inner {
        transform: rotateY(172deg) translateY(-4px);
      }
      .card-wrapper:hover .card-face {
        box-shadow: 0 14px 36px rgba(14, 116, 144, 0.28),
                    0 4px 12px rgba(14, 116, 144, 0.15);
      }
    }

    /* 进度提示 */
    .progress {
      text-align: center;
      margin-top: 22px;
      font-weight: 700;
      font-size: 14px;
      color: #0369a1;
      opacity: 0.8;
    }

    .progress .count {
      font-weight: 900;
      color: #0ea5e9;
      font-size: 16px;
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 16px 12px 32px;
      }
      .card-grid {
        grid-template-columns: 1fr;
        gap: 16px;
        max-width: 380px;
        margin: 0 auto;
      }
      .card-wrapper {
        aspect-ratio: 5 / 3.5;
      }
      .header h1 {
        font-size: 22px;
      }
      .btn {
        font-size: 14px;
        padding: 10px 20px;
        border-radius: 12px;
      }
    }

    /* 减少动画偏好 */
    @media (prefers-reduced-motion: reduce) {
      .card-inner {
        transition: transform 0.3s ease;
      }
      .btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="root"></div>

  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // 卡片数据
    const initialCards = [
      {
        id: 1,
        image: 'assets/card1.jpg',
        sentence: "Wenchang International Aerospace City is home to China's first commercial spacecraft launch site."
      },
      {
        id: 2,
        image: 'assets/card2.jpg',
        sentence: "It serves as an industrial base for key technological innovations in aerospace and an international cooperation hub for aerospace technology."
      },
      {
        id: 3,
        image: 'assets/card3.jpg',
        sentence: "The city consists of three zones: a high-tech zone, a launch zone, and a(n) tourism zone."
      },
      {
        id: 4,
        image: 'assets/card4.jpg',
        sentence: "Visitors can explore interactive aerospace exhibits and learn about China's achievements in space exploration."
      },
      {
        id: 5,
        image: 'assets/card5.jpg',
        sentence: "Wenchang is building interconnected rocket, satellite, and data application industries."
      },
      {
        id: 6,
        image: 'assets/card6.jpg',
        sentence: "This collective effort will transform Wenchang into a world-class, open, and modern center for the global aerospace industry."
      }
    ];

    // 音效生成器 - 俏皮风格的翻卡声
    function createFlipSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return () => {};
      const audioCtx = new AudioContext();

      return function playFlipSound() {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 1.0; // 最大音量
        masterGain.connect(audioCtx.destination);

        // 第一声：清脆的"咔嗒" - 高频短促
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(1200, now);
        osc1.frequency.exponentialRampToValueAtTime(600, now + 0.06);
        gain1.gain.setValueAtTime(0, now);
        gain1.gain.linearRampToValueAtTime(0.5, now + 0.005);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc1.connect(gain1);
        gain1.connect(masterGain);
        osc1.start(now);
        osc1.stop(now + 0.1);

        // 第二声：上扬的"嗖"声 - 俏皮感
        const osc2 = audioContext_createOscillatorSafe(audioCtx);
        const gain2 = audioCtx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(300, now + 0.02);
        osc2.frequency.exponentialRampToValueAtTime(900, now + 0.15);
        gain2.gain.setValueAtTime(0, now + 0.02);
        gain2.gain.linearRampToValueAtTime(0.35, now + 0.04);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc2.connect(gain2);
        gain2.connect(masterGain);
        osc2.start(now + 0.02);
        osc2.stop(now + 0.2);

        // 第三声：结尾小弹音 - 节奏强
        const osc3 = audioContext_createOscillatorSafe(audioCtx);
        const gain3 = audioCtx.createGain();
        osc3.type = 'square';
        osc3.frequency.setValueAtTime(1600, now + 0.1);
        osc3.frequency.exponentialRampToValueAtTime(2200, now + 0.14);
        gain3.gain.setValueAtTime(0, now + 0.1);
        gain3.gain.linearRampToValueAtTime(0.15, now + 0.105);
        gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc3.connect(gain3);
        gain3.connect(masterGain);
        osc3.start(now + 0.1);
        osc3.stop(now + 0.22);
      };
    }

    // 安全创建 oscillator，防止不同浏览器兼容性问题
    function audioContext_createOscillatorSafe(ctx) {
      return ctx.createOscillator();
    }

    // 自适应字体大小计算
    function calculateFontSize(text, containerWidth, containerHeight) {
      // 基础估算：字符数与卡片面积的比例
      const chars = text.length;
      // 估算每行大约能放的字符数（基于宽度和平均字符宽度比）
      const avgCharRatio = 0.55; // 英文字符宽度约为字号的 0.55 倍
      const lineHeightRatio = 1.45;

      // 二分法查找最佳字号
      let minSize = 10;
      let maxSize = 48;
      let bestSize = minSize;

      for (let i = 0; i < 15; i++) {
        const midSize = (minSize + maxSize) / 2;
        const charWidth = midSize * avgCharRatio;
        const charsPerLine = Math.floor(containerWidth / charWidth);
        const lines = Math.ceil(chars / charsPerLine);
        const totalHeight = lines * midSize * lineHeightRatio;

        if (totalHeight <= containerHeight * 0.92 && charsPerLine >= 8) {
          bestSize = midSize;
          minSize = midSize;
        } else {
          maxSize = midSize;
        }
      }

      return Math.max(12, bestSize);
    }

    // Fisher-Yates 洗牌算法
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function Card({ card, isFlipped, onFlip, index }) {
      const sentenceRef = useRef(null);
      const containerRef = useRef(null);
      const [fontSize, setFontSize] = useState(18);

      useEffect(() => {
        function updateSize() {
          if (containerRef.current && sentenceRef.current) {
            const rect = containerRef.current.getBoundingClientRect();
            const padX = 40; // 左右 padding
            const padY = 70; // 上下 padding + footer 空间
            const size = calculateFontSize(
              card.sentence,
              rect.width - padX,
              rect.height - padY
            );
            setFontSize(size);
          }
        }

        updateSize();
        window.addEventListener('resize', updateSize);
        return () => window.removeEventListener('resize', updateSize);
      }, [card.sentence]);

      return (
        <div
          className={`card-wrapper ${isFlipped ? 'flipped' : ''}`}
          onClick={onFlip}
          ref={containerRef}
          role="button"
          tabIndex={0}
          aria-label={`卡片 ${index + 1}，点击翻转`}
          onKeyDown={(e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              onFlip();
            }
          }}
        >
          <div className="card-inner">
            {/* 正面 */}
            <div className="card-face card-front">
              <span className="card-number">No.{card.id}</span>
              <img src={card.image} alt={`卡片 ${card.id}`} loading="lazy" />
              <span className="tap-hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
                点我翻转
              </span>
            </div>
            {/* 背面 */}
            <div className="card-face card-back">
              <div className="sentence-container">
                <p
                  className="sentence"
                  ref={sentenceRef}
                  style={{ fontSize: `${fontSize}px` }}
                >
                  {card.sentence}
                </p>
              </div>
              <div className="card-footer">
                <span className="card-index">Sentence {card.id}</span>
                <span className="flip-back-hint">点击翻回</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [cards, setCards] = useState(initialCards);
      const [flippedIds, setFlippedIds] = useState(new Set());
      const playFlipSoundRef = useRef(null);

      useEffect(() => {
        playFlipSoundRef.current = createFlipSound();
        // 首次用户交互后解锁 audio context
        const unlock = () => {
          if (playFlipSoundRef.current) {
            playFlipSoundRef.current();
          }
          document.removeEventListener('click', unlock);
          document.removeEventListener('keydown', unlock);
          document.removeEventListener('touchstart', unlock);
        };
        // 不立即播放，只准备 context
        document.addEventListener('click', () => {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            // 预热
          }
        }, { once: true });
      }, []);

      const handleFlip = useCallback((id) => {
        if (playFlipSoundRef.current) {
          playFlipSoundRef.current();
        }
        setFlippedIds((prev) => {
          const next = new Set(prev);
          if (next.has(id)) {
            next.delete(id);
          } else {
            next.add(id);
          }
          return next;
        });
      }, []);

      const handleReset = useCallback(() => {
        // 播放一个特殊的重置音效
        if (playFlipSoundRef.current) {
          playFlipSoundRef.current();
        }
        setTimeout(() => {
          if (playFlipSoundRef.current) playFlipSoundRef.current();
        }, 120);
        setFlippedIds(new Set());
      }, []);

      const handleShuffle = useCallback(() => {
        if (playFlipSoundRef.current) {
          playFlipSoundRef.current();
        }
        setTimeout(() => {
          if (playFlipSoundRef.current) playFlipSoundRef.current();
        }, 100);
        setCards((prev) => shuffleArray(prev));
      }, []);

      const flippedCount = flippedIds.size;
      const totalCount = cards.length;

      return (
        <>
          <div className="header">
            <h1>🚀 Wenchang Aerospace City</h1>
            <p className="subtitle">点击卡片学习英语句子 · Click to flip and learn</p>
          </div>

          <div className="controls">
            <button className="btn btn-secondary" onClick={handleReset}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
              全部重置
            </button>
            <button className="btn btn-primary" onClick={handleShuffle}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M16 3h5v5"></path>
                <path d="M4 20 21 3"></path>
                <path d="M21 16v5h-5"></path>
                <path d="M15 15l6 6"></path>
                <path d="M4 4l5 5"></path>
              </svg>
              随机排序
            </button>
          </div>

          <div className="card-grid">
            {cards.map((card, index) => (
              <Card
                key={card.id}
                card={card}
                index={index}
                isFlipped={flippedIds.has(card.id)}
                onFlip={() => handleFlip(card.id)}
              />
            ))}
          </div>

          <div className="progress">
            已学习 <span className="count">{flippedCount}</span> / {totalCount} 张卡片
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // 宣告可升级
    function announceUpgrade() {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>
</body>
</html>
